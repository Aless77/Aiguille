version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Une seule PR par semaine pour les mises à jour mineures et correctifs.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Next et eslint-config-next montent ensemble, à la main (lire le guide de migration).
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: eslint-config-next
        update-types: [version-update:semver-major]
      # ESLint 10 : bloqué tant que les plugins de eslint-config-next ne le supportent pas.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
