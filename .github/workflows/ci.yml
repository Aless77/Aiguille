# Vérifie chaque pull request (et chaque push sur main) avant le déploiement Vercel.
# Les mêmes commandes tournent en local : docker compose run --rm tools npm run check
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Les pages sont prérendues depuis la base : le build a besoin d'une base migrée (vide suffit,
    # generateStaticParams renvoie alors un paramètre factice).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aiguille
          POSTGRES_PASSWORD: aiguille
          POSTGRES_DB: aiguille
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiguille -d aiguille"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://aiguille:aiguille@localhost:5432/aiguille
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Même installation que Vercel : seulement apps/web et ses workspaces (+ db pour les
      # migrations). Échoue si une dépendance du site n'est déclarée qu'à la racine.
      - run: npm ci -w @aiguille/web -w @aiguille/db --no-audit --no-fund
      # Marques de référence + 3 montres fictives (TEST-…) pour que les tests e2e aient une fiche.
      - run: npm run migrate -w @aiguille/db && npm run seed -w @aiguille/db && npm run seed:e2e -w @aiguille/db
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Tests de bout en bout (Playwright) sur le build de production.
      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Démarrer le site
        run: |
          npm run start -w @aiguille/web &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/robots.txt && exit 0; sleep 2; done
          echo "::error::Le site ne répond pas" && exit 1
      - name: Tests e2e
        run: npm run e2e -w @aiguille/web
        env:
          BASE_URL: http://localhost:3000
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  database:
    name: Migrations et seed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aiguille
          POSTGRES_PASSWORD: aiguille
          POSTGRES_DB: aiguille
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiguille -d aiguille"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://aiguille:aiguille@localhost:5432/aiguille
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Le schéma Drizzle et les migrations commitées sont synchronisés
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::schema.ts a changé sans migration. Lancez npm run db:generate et commitez packages/db/drizzle."
            git status --porcelain packages/db/drizzle
            exit 1
          fi
      - run: npm run db:migrate
      - run: npm run db:seed
