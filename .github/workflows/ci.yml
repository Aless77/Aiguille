# Vérifie chaque pull request (et chaque push sur main) avant le déploiement Vercel.
# Les mêmes commandes tournent en local : docker compose run --rm tools npm run check
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Même installation que Vercel : seulement apps/web et ses workspaces. Échoue si une
      # dépendance utilisée par le site n'est déclarée qu'à la racine.
      - run: npm ci -w @aiguille/web --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  database:
    name: Migrations et seed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aiguille
          POSTGRES_PASSWORD: aiguille
          POSTGRES_DB: aiguille
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiguille -d aiguille"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://aiguille:aiguille@localhost:5432/aiguille
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Le schéma Drizzle et les migrations commitées sont synchronisés
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::schema.ts a changé sans migration. Lancez npm run db:generate et commitez packages/db/drizzle."
            git status --porcelain packages/db/drizzle
            exit 1
          fi
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Le scraper atteint la base
        run: npm run scraper
